services:

  api:
    build: .
    container_name: devops-api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      DATABASE_HOST: postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: devopsdb
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: