name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: python -m pytest -v app/

      - name: Build Docker image
        run: |
          docker build \
            -t acrdevopsrebootdev.azurecr.io/devops-reboot:${{ github.sha }} \
            ./app

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name acrdevopsrebootdev

      - name: Push Docker image
        run: |
          docker push \
            acrdevopsrebootdev.azurecr.io/devops-reboot:${{ github.sha }}
            