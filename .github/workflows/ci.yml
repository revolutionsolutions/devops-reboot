name: CI

on:
  push:
    branches:
      - ci-cd
    paths:
      - 'app/**'

  pull_request:
    branches:
      - ci-cd
    paths:
      - 'app/**'

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: python -m pytest -v app/

      - name: Build Docker image
        run: |
          docker build \
            -t acrdevopsrebootdev.azurecr.io/devops-reboot:${{ github.sha }} \
            ./app

      - name: Azure Login
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: github.event_name == 'push'
        run: az acr login --name acrdevopsrebootdev

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push acrdevopsrebootdev.azurecr.io/devops-reboot:${{ github.sha }}